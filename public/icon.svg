<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141f30" />
      <stop offset="100%" stop-color="#070a0f" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E296" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83B43" />
      <stop offset="100%" stop-color="#8B1A1E" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A859" />
      <stop offset="100%" stop-color="#004724" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="url(#goldGrad)" stroke-width="14" />

  <!-- 3D Tetris Blocks in Background -->
  <!-- T-piece in Moroccan Red -->
  <g transform="translate(136, 110)">
    <!-- Top Mino -->
    <rect x="80" y="0" width="80" height="80" rx="10" fill="url(#redGrad)" stroke="#FF6B72" stroke-width="4" />
    <!-- Row of 3 Minos -->
    <rect x="0" y="80" width="80" height="80" rx="10" fill="url(#redGrad)" stroke="#FF6B72" stroke-width="4" />
    <rect x="80" y="80" width="80" height="80" rx="10" fill="url(#redGrad)" stroke="#FF6B72" stroke-width="4" />
    <rect x="160" y="80" width="80" height="80" rx="10" fill="url(#redGrad)" stroke="#FF6B72" stroke-width="4" />
  </g>

  <!-- Central Moroccan 5-pointed Cherifian Star in Emerald Green with Gold Outline -->
  <g transform="translate(256, 330) scale(1.35)">
    <!-- Glow behind star -->
    <polygon points="0,-75 22,-23 76,-23 32,9 49,61 0,28 -49,61 -32,9 -76,-23 -22,-23" 
             fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />
  </g>

  <!-- Inner star facets for 3D relief -->
  <g transform="translate(256, 330) scale(1.35)">
    <line x1="0" y1="28" x2="0" y2="-75" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="28" x2="76" y2="-23" stroke="#004724" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="28" x2="49" y2="61" stroke="#00A859" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="28" x2="-49" y2="61" stroke="#00351B" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="28" x2="-76" y2="-23" stroke="#22C55E" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
